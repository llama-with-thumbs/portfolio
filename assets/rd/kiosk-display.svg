<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- monitor -->
  <rect x="240" y="100" width="320" height="200" rx="10" fill="#1d3557" stroke="#457b9d" stroke-width="2.5"/>
  <rect x="258" y="118" width="284" height="164" rx="4" fill="#0f1626"/>
  <!-- stand -->
  <path d="M375,300 L425,300 L437,336 L363,336 Z" fill="#1d3557" stroke="#457b9d" stroke-width="2"/>
  <rect x="330" y="336" width="140" height="10" rx="5" fill="#457b9d" opacity="0.7"/>

  <!-- kiosk content: queue list -->
  <g opacity="0.9">
    <rect x="278" y="138" width="120" height="14" rx="4" fill="#e94560" opacity="0.85"/>
    <rect x="278" y="170" width="244" height="10" rx="4" fill="#457b9d" opacity="0.55"/>
    <rect x="278" y="192" width="212" height="10" rx="4" fill="#457b9d" opacity="0.45"/>
    <rect x="278" y="214" width="230" height="10" rx="4" fill="#457b9d" opacity="0.35"/>
    <rect x="278" y="236" width="180" height="10" rx="4" fill="#457b9d" opacity="0.25"/>
  </g>

  <!-- auto-refresh loop -->
  <g fill="none" stroke="#533483" stroke-width="3" stroke-linecap="round">
    <path d="M624,180 a44,44 0 1,1 -30,-42"/>
    <path d="M594,116 L598,142 L572,140"/>
  </g>

  <text x="400" y="392" text-anchor="middle" fill="#a0a0a0" font-family="Inter,sans-serif" font-size="15" letter-spacing="0.08em">WAITING-ROOM KIOSK DISPLAY</text>
</svg>
