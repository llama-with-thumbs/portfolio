<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- dosing cone (funnel) -->
  <g stroke="#457b9d" stroke-width="2.5" fill="#1d3557" stroke-linejoin="round">
    <path d="M300,130 L500,130 L432,250 L368,250 Z"/>
    <ellipse cx="400" cy="130" rx="100" ry="20" fill="#0f1626"/>
  </g>

  <!-- portafilter basket below -->
  <g stroke="#533483" stroke-width="2.5" fill="none">
    <path d="M348,262 L452,262 L438,330 L362,330 Z" fill="#1d3557"/>
    <line x1="452" y1="278" x2="560" y2="292" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- grounds falling -->
  <g fill="#e94560" opacity="0.8">
    <circle cx="392" cy="196" r="4"/>
    <circle cx="410" cy="216" r="3"/>
    <circle cx="398" cy="238" r="3.5"/>
  </g>

  <!-- layer lines hint (3D print) -->
  <g stroke="#457b9d" stroke-width="1" opacity="0.35">
    <line x1="316" y1="158" x2="484" y2="158"/>
    <line x1="330" y1="184" x2="470" y2="184"/>
    <line x1="344" y1="210" x2="456" y2="210"/>
  </g>

  <text x="400" y="392" text-anchor="middle" fill="#a0a0a0" font-family="Inter,sans-serif" font-size="15" letter-spacing="0.08em">3D-PRINTED DOSING CONE</text>
</svg>
