<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- table top -->
  <g stroke="#457b9d" fill="none" stroke-width="2" stroke-linejoin="round">
    <path d="M250,190 L550,190 L620,250 L180,250 Z" fill="#1d3557" opacity="0.9"/>
    <path d="M215,250 L215,330 M585,250 L585,330 M300,250 L300,330 M500,250 L500,330" stroke-width="3"/>
  </g>

  <!-- embedded LCD -->
  <rect x="355" y="200" width="90" height="34" rx="4" fill="#0f1626" stroke="#e94560" stroke-width="2"/>
  <g stroke="#e94560" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="366" y1="211" x2="400" y2="211"/>
    <line x1="366" y1="221" x2="388" y2="221"/>
  </g>

  <!-- geometry / synchrony rings -->
  <g fill="none" stroke="#533483" stroke-width="2" opacity="0.75">
    <circle cx="400" cy="120" r="58"/>
    <circle cx="400" cy="120" r="36"/>
    <path d="M400,62 L450,150 L350,150 Z"/>
  </g>
  <circle cx="400" cy="120" r="6" fill="#e94560"/>

  <text x="400" y="392" text-anchor="middle" fill="#a0a0a0" font-family="Inter,sans-serif" font-size="15" letter-spacing="0.08em">SYNCHRONICITY TABLE</text>
</svg>
